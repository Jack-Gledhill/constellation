---
ansible_user: root
ansible_host: kube1.starsystem.dev
ansible_port: 22

k3s:
  server: ""

  node:
    init_cluster: true
    role: server
    labels:
      - proxmox.sinextra.dev/instance-id=200
      - topology.kubernetes.io/region=constellation
      - topology.kubernetes.io/zone=sagittarius
    taints: [ ]

nvidia:
  drivers:
    install: true
    version: 580.178.04
    installer_args:
      - --dkms
  container_toolkit:
    install: true
    version: 1.20.1
    runtime: containerd
    rootless: false