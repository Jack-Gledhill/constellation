---
- name: Install and configure sshd
  when: sshd.install

  block:
    - name: Install OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: yes

    - name: Configure sshd
      ansible.builtin.template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644" # U:RW, G:R, O:R
      notify: Restart sshd