---
- name: Install SSSD and enrol in LDAP domain
  when: sssd.install

  block:
    - name: Install SSSD and dependencies
      ansible.builtin.apt:
        name:
          - sssd
          - sssd-tools
          - libsss-sudo
          - libnss-sss
          - libpam-sss
        state: present
        update_cache: yes

    - name: Set global SSSD configuration
      ansible.builtin.template:
        src: templates/sssd.conf.j2
        dest: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: "0600"

    - name: Add LDAP domain configuration
      ansible.builtin.template:
        src: templates/domain.conf.j2
        dest: /etc/sssd/conf.d/{{ sssd.domain_name }}.conf
        owner: root
        group: root
        mode: "0600"

    - name: Verify configuration
      ansible.builtin.command: sssctl config-check
      register: config_check
      failed_when: config_check.rc != 0
      notify: Restart sssd