---
- name: Setup control plane nodes
  when: kubernetes_node.role == "control_plane"

  block:
    - name: Creates k3s directory if needed
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755" # U:RWX, G:RX, O:RX

    - name: Export kubeconfig on login
      ansible.builtin.lineinfile:
        line: export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        path: /etc/profile
        state: present

    - name: Upload config file
      ansible.builtin.template:
        src: templates/control_plane.yml.j2
        dest: /etc/rancher/k3s/config.yaml
        force: true
        owner: root
        group: root
        mode: "0644" # U:RW, G:R, O:R

    - name: Download k3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s.sh
        mode: "0700" # U:RWX, G:N, O:N

    - name: Run the k3s installation script
      ansible.builtin.command:
        cmd: bash /tmp/k3s.sh server # TODO
      register: res
      changed_when: res.rc not in [0, 1]
      failed_when: res.rc not in [0, 1]