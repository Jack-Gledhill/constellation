apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: sure
  policyTypes:
    - Ingress
  ingress:
    # Only allow access from sure pods in sure namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sure
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sure
      ports:
        - port: 6379