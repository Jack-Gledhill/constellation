apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sure
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: sure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: sure
    spec:
      containers:
        - name: api
          image: ghcr.io/we-promise/sure:0.7.6
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sure-config
            - secretRef:
                name: sure-secrets
          resources:
            requests:
              cpu: 10m
              memory: 300Mi
            limits:
              memory: 400Mi
          volumeMounts:
            - name: data
              mountPath: /rails/storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sure-data