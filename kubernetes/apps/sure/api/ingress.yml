apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sure-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - sure.starsystem.dev
      secretName: sure-tls
  rules:
    - host: sure.starsystem.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sure-api
                port:
                  number: 3000