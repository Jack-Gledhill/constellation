apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: authelia
  policyTypes:
    - Ingress
  ingress:
    # Only allow access from Authelia pods in authelia namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authelia
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authelia
      ports:
        - port: 6379