apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
    spec:
      enableServiceLinks: false # Required as per https://www.authelia.com/integration/kubernetes/introduction/
      priorityClassName: network-critical
      containers:
        - name: authelia
          image: authelia/authelia:4.39
          command:
            - authelia
          args:
            - "--config=/config"
            - "--config.experimental.filters=template"
          env:
            - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
              value: /secrets/ldap.password
            - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
              value: /secrets/oidc.hmac_secret
            - name: AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE
              value: /secrets/smtp.password
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session.secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/database.encryption_key
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
              value: /secrets/database.password
            - name: TZ
              value: Europe/London
          ports:
            - name: http
              containerPort: 9091
            - name: metrics
              containerPort: 9959
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 100Mi
          volumeMounts:
            - name: clients
              mountPath: /clients
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: clients
          projected:
            sources:
              - configMap:
                  name: authelia-client-argocd
              - configMap:
                  name: authelia-client-homarr
              - configMap:
                  name: authelia-client-immich
              - configMap:
                  name: authelia-client-openwebui
              - configMap:
                  name: authelia-client-paperless-ngx
              - configMap:
                  name: authelia-client-splitpro
              - configMap:
                  name: authelia-client-sure
        - name: config
          projected:
            sources:
              - secret:
                  name: authelia-config-auth
              - secret:
                  name: authelia-config-forward-auth
              - secret:
                  name: authelia-config-metrics
              - secret:
                  name: authelia-config-oidc
              - secret:
                  name: authelia-config-session
              - secret:
                  name: authelia-config-smtp
              - secret:
                  name: authelia-config-storage
        - name: secrets
          projected:
            sources:
              - secret:
                  name: authelia-secrets