apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  policyTypes:
    - Ingress
  ingress:
    # Only allow Prometheus to access metrics port
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9959
    # Allow HTTP access from anywhere
    - ports:
        - port: 9091