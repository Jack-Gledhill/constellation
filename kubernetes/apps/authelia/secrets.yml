apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authelia-secrets
  data:
    - secretKey: database.encryption_key
      remoteRef:
        key: /authelia/DATABASE_ENCRYPTION_KEY
    - secretKey: database.password
      remoteRef:
        key: /authelia/DATABASE_PASSWORD
    - secretKey: ldap.bind_password
      remoteRef:
        key: /authelia/LDAP_BIND_PASSWORD
    - secretKey: oidc.hmac_secret
      remoteRef:
        key: /authelia/OIDC_HMAC_SECRET
    - secretKey: oidc.jwk_key
      remoteRef:
        key: /authelia/OIDC_JWK_KEY
    - secretKey: session.secret
      remoteRef:
        key: /authelia/SESSION_SECRET
    - secretKey: smtp.password
      remoteRef:
        key: /authelia/SMTP_PASSWORD