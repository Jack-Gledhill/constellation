apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: error-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-landing
    spec:
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: error-landing
      containers:
        - name: error-landing
          image: ghcr.io/jack-gledhill/error-landing:v1.0.0
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080