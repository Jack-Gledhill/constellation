apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
    spec:
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v2
          ports:
            - name: http
              containerPort: 2283
            - name: metrics
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-data