apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: immich-secrets
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: /immich/DATABASE_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /immich/DATABASE_PASSWORD
    - secretKey: DB_DATABASE_NAME
      remoteRef:
        key: /immich/DATABASE_NAME