apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - photos.starsystem.dev
      secretName: server-tls
  rules:
    - host: photos.starsystem.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server-api
                port:
                  number: 2283