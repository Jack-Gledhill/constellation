apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-redis
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: argocd-redis
    app.kubernetes.io/part-of: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-redis
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: argocd-redis
    app.kubernetes.io/part-of: argocd
rules:
  - apiGroups:
      - ""
    resourceNames:
      - argocd-redis
    resources:
