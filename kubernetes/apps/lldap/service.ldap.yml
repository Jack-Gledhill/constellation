apiVersion: v1
kind: Service
metadata:
  name: lldap-ldap
  annotations:
    metallb.io/loadBalancerIPs: 10.1.2.1
spec:
  selector:
    app.kubernetes.io/name: lldap
  type: LoadBalancer
  ports:
    - name: ldap
      port: 389
      targetPort: 389
    - name: ldaps
      port: 636
      targetPort: 636