apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: lldap-secrets
  data:
    - secretKey: database_url
      remoteRef:
        key: /lldap/DATABASE_URL
    - secretKey: jwt_secret
      remoteRef:
        key: /lldap/JWT_SECRET
    - secretKey: key_seed
      remoteRef:
        key: /lldap/KEY_SEED
    - secretKey: user_password
      remoteRef:
        key: /lldap/USER_PASSWORD
    - secretKey: smtp_password
      remoteRef:
        key: /lldap/SMTP_PASSWORD