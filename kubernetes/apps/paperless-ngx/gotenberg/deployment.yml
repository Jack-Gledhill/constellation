apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
      app.kubernetes.io/part-of: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotenberg
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.38.1
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
            limits:
              memory: 2Gi