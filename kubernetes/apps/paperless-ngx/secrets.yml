apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: paperless-ngx-secrets
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: /paperless/PAPERLESS_SECRET_KEY
    - secretKey: PAPERLESS_DBPASS
      remoteRef:
        key: /paperless/PAPERLESS_DBPASS
    - secretKey: PAPERLESS_EMAIL_HOST_PASSWORD
      remoteRef:
        key: /paperless/PAPERLESS_EMAIL_HOST_PASSWORD
    - secretKey: PAPERLESS_SOCIALACCOUNT_PROVIDERS
      remoteRef:
        key: /paperless/PAPERLESS_SOCIALACCOUNT_PROVIDERS