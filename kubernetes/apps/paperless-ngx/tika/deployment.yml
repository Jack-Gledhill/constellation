apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tika
      app.kubernetes.io/part-of: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tika
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      containers:
        - name: tika
          image: apache/tika:4.1.0.2-full
          ports:
            - name: http
              containerPort: 9998
          securityContext:
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
            limits:
              memory: 2Gi