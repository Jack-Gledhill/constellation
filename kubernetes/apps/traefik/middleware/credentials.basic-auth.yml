apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: basic-auth-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: basic-auth-credentials

  data:
    - secretKey: username
      remoteRef:
        key: /traefik/BASIC_AUTH_USERNAME
    - secretKey: password
      remoteRef:
        key: /traefik/BASIC_AUTH_PASSWORD