apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitpro
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: splitpro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: splitpro
    spec:
      containers:
        - name: splitpro
          image: ossapps/splitpro:v2.1.6
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              memory: 400Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: splitpro-uploads