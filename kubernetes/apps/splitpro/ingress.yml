apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splitpro
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - bills.8bc.xyz
      secretName: splitpro-tls
  rules:
    - host: bills.8bc.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: splitpro
                port:
                  number: 3000