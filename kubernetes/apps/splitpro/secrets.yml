apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splitpro-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: splitpro-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /splitpro/DATABASE_URL
    - secretKey: EMAIL_SERVER_PASSWORD
      remoteRef:
        key: /splitpro/EMAIL_SERVER_PASSWORD
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: /splitpro/NEXTAUTH_SECRET
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /splitpro/OIDC_CLIENT_SECRET
    - secretKey: WEB_PUSH_PRIVATE_KEY
      remoteRef:
        key: /splitpro/WEB_PUSH_PRIVATE_KEY