apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    argocd.argoproj.io/type: AoA
  annotations:
    notifications.argoproj.io/subscribe.on-sync-change.github: Jack-Gledhill/constellation
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  sources:
    - repoURL: https://github.com/Jack-Gledhill/constellation.git
      targetRevision: main
      path: kubernetes/argocd
    - repoURL: https://github.com/Jack-Gledhill/constellation.git
      targetRevision: main
      path: kubernetes/apps/argocd