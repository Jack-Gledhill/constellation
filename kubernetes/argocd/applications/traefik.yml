apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  labels:
    argocd.argoproj.io/sync-wave: "1"
  annotations:
    notifications.argoproj.io/subscribe.on-sync-change.github: Jack-Gledhill/constellation
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: network
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://github.com/Jack-Gledhill/constellation.git
      targetRevision: main
      path: kubernetes/apps/traefik
    - repoURL: https://github.com/Jack-Gledhill/constellation.git
      targetRevision: main
      path: kubernetes/apps/error-landing