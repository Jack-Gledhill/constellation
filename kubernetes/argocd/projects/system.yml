apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: A service belongs here if it provides critical functionality to the cluster, but very little to the end-user directly.
  sourceRepos:
    - https://github.com/Jack-Gledhill/constellation.git
    - https://stakater.github.io/stakater-charts
    - https://charts.external-secrets.io
    - https://nvidia.github.io/k8s-device-plugin
    - oci://ghcr.io/sergelogvinov/charts/proxmox-csi-plugin
    - https://ot-container-kit.github.io/helm-charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: nvidia-device-plugin
    - server: https://kubernetes.default.svc
      namespace: csi-proxmox
    - server: https://kubernetes.default.svc
      namespace: redis-operator
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"