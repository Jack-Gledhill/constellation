apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: End-user applications exposed to the internet.
  sourceRepos:
    - https://github.com/Jack-Gledhill/constellation.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: immich
    - server: https://kubernetes.default.svc
      namespace: paperless-ngx
    - server: https://kubernetes.default.svc
      namespace: splitpro
    - server: https://kubernetes.default.svc
      namespace: sure
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"