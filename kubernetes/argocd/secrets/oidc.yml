apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
  labels:
    app.kubernetes.io/name: argocd-oidc-secret
    app.kubernetes.io/part-of: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: argocd-oidc-secret

  data:
    - secretKey: authelia.clientID
      remoteRef:
        key: /argocd/OIDC_CLIENT_ID
    - secretKey: authelia.cliClientID
      remoteRef:
        key: /argocd/OIDC_CLI_CLIENT_ID
    - secretKey: authelia.clientSecret
      remoteRef:
        key: /argocd/OIDC_CLIENT_SECRET